<style>
:root{
  --ink:#16202c;--ink-2:#4b5563;--ink-3:#6b7480;
  --rule:#d9dde3;--rule-strong:#9aa3ad;--field:#7c8691;
  --page:#ffffff;--wash:#f4f5f7;
  --navy:#132a4a;--link:#1550a8;--link-hover:#0d3a7c;--link-visited:#1550a8;
  --green:#0f6b3a;--green-bg:#dff0e5;--amber:#7a4b00;--amber-bg:#fbeccd;--red:#a3231a;--red-bg:#f9e1de;--grey-bg:#e7eaee;
  --focus:#ffcc33
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font:16px/1.5 "PT Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:lining-nums tabular-nums}
a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--link-hover);text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--focus);outline-offset:0;box-shadow:0 0 0 1px var(--ink)}
h1{font-size:34px;line-height:1.18;font-weight:700;margin:0 0 18px;letter-spacing:-.005em}
h2{font-size:25px;line-height:1.25;font-weight:700;margin:44px 0 14px}
h3{font-size:19px;line-height:1.3;font-weight:700;margin:30px 0 10px}
p{margin:0 0 14px}
.lede{font-size:19px;line-height:1.45;color:var(--ink);max-width:720px;margin-bottom:28px}
.hint{color:var(--ink-3);font-size:15px}
.small{font-size:14px}
.nowrap{white-space:nowrap}
.width{max-width:1040px;margin:0 auto;padding-left:32px;padding-right:32px}
main{padding:36px 0 72px}

/* шапка */
.masthead{background:var(--navy);color:#fff;border-bottom:6px solid #2d5fa8}
.masthead .width{display:flex;align-items:center;gap:28px;min-height:62px}
.service{color:#fff;font-weight:700;font-size:19px;text-decoration:none;letter-spacing:.005em}
.service:hover{color:#fff;text-decoration:underline}
.masthead nav{margin-left:auto;display:flex;gap:26px}
.masthead nav a{color:#fff;text-decoration:none;font-size:16px}
.masthead nav a:hover,.masthead nav a[aria-current]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.crumbs{font-size:15px;color:var(--ink-3);margin:0 0 22px}
.crumbs a{color:var(--ink-2)}

/* кнопки */
.button{display:inline-block;background:var(--link);color:#fff;border:0;border-radius:3px;font:inherit;font-weight:700;
  font-size:17px;line-height:1;padding:13px 22px;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 #0b2f66}
.button:hover{background:var(--link-hover);color:#fff;text-decoration:none}
.button:active{transform:translateY(2px);box-shadow:none}
.button.secondary{background:var(--wash);color:var(--ink);box-shadow:0 2px 0 #b8bec6}
.button.secondary:hover{background:#e6e9ed}
.button[disabled]{opacity:.6;cursor:progress}
.button-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin:6px 0 28px}
.link-button{background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.link-button:hover{color:var(--link-hover);text-decoration-thickness:2px}

/* метки состояния */
.tag{display:inline-block;padding:3px 8px 2px;border-radius:2px;font-size:13px;font-weight:700;line-height:1.35;
  letter-spacing:.02em;white-space:nowrap}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.grey{background:var(--grey-bg);color:var(--ink-2)}

/* реквизиты «название — значение» */
.summary{margin:0 0 30px;border-top:1px solid var(--rule)}
.summary div{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule)}
.summary dt{font-weight:700}
.summary dd{margin:0}
.summary .big{font-size:24px;font-weight:700;line-height:1.25}

/* врезка и уведомление */
.inset{border-left:5px solid var(--rule);padding:4px 0 4px 18px;margin:18px 0 22px;max-width:760px}
.banner{border:4px solid var(--link);margin:0 0 30px}
.banner .banner-title{background:var(--link);color:#fff;font-weight:700;padding:6px 16px 8px;font-size:16px}
.banner .banner-body{padding:16px 18px 6px}
.banner.amber{border-color:#b26f00}
.banner.amber .banner-title{background:#b26f00}
.banner.red{border-color:var(--red)}
.banner.red .banner-title{background:var(--red)}

/* формы */
.field{margin:0 0 26px;max-width:720px}
.field>label,.field>legend{display:block;font-weight:700;font-size:18px;margin:0 0 4px}
.field .hint{display:block;margin:0 0 10px}
input[type=text],input:not([type]),input[type=date],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);
  border:2px solid var(--field);border-radius:0;padding:8px 10px;background:#fff}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input[type=file]{font:inherit;font-size:16px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:700;font-size:16px;margin-right:14px;padding:9px 16px;
  border:0;border-radius:3px;background:var(--wash);color:var(--ink);box-shadow:0 2px 0 #b8bec6;cursor:pointer}
fieldset{border:0;margin:0;padding:0}
.checks-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.checkbox{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:17px;cursor:pointer}
.checkbox input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--navy)}
.checkbox .hint{display:block;font-size:15px}
.or{font-weight:700;margin:-6px 0 18px;color:var(--ink-2)}
.error-text{color:var(--red);font-weight:700;margin:6px 0 0}
.field.has-error{border-left:5px solid var(--red);padding-left:16px}

/* таблицы */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:15.5px}
caption{text-align:left;font-weight:700;font-size:19px;padding:0 0 10px}
th,td{text-align:left;vertical-align:top;padding:11px 16px 11px 0;border-bottom:1px solid var(--rule)}
th{font-weight:700;border-bottom:2px solid var(--rule-strong)}
th:last-child,td:last-child{padding-right:0}
td.num,th.num{text-align:right}
td.num{white-space:nowrap}
tr.detail>td{background:var(--wash);padding:18px 18px 20px}
td .sub{display:block;color:var(--ink-3);font-size:14px;margin-top:2px}
tfoot td{font-weight:700;border-bottom:0}

/* раскрытие */
details{margin:0 0 6px}
details>summary{cursor:pointer;color:var(--link);display:inline-block;list-style:none;padding-left:22px;position:relative}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";position:absolute;left:2px;top:.42em;border-style:solid;border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent currentColor}
details[open]>summary::before{border-width:10px 6px 0 6px;border-color:currentColor transparent transparent transparent;top:.5em}
details>summary span.u{text-decoration:underline;text-underline-offset:2px}
details>summary:hover span.u{text-decoration-thickness:2px}
details>.inner{border-left:5px solid var(--rule);padding:12px 0 6px 20px;margin:10px 0 18px}

/* разделы отчёта */
.section{border-top:2px solid var(--ink);padding-top:6px;margin-top:48px}
.section>h2{margin-top:10px}
.pos-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.pos-head h2{margin:10px 0 6px}
.pos-head .tag{margin-top:16px}
.meta{color:var(--ink-2);margin:0 0 18px}
.figures{margin:0 0 22px;border-top:1px solid var(--rule);max-width:760px}
.figures div{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid var(--rule)}
.figures dt{color:var(--ink-2)}
.figures dd{margin:0;font-weight:700}
.figures .plain{font-weight:400}
.checks{list-style:none;margin:0;padding:0;font-size:15px}
.checks li{padding:3px 0}
.checks .st{display:inline-block;min-width:116px;font-weight:700}
.st.ok,.st.above{color:var(--green)}.st.fail{color:var(--red)}.st.missing,.st.unclear{color:var(--ink-3)}
.detail-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:32px}
.detail-cols h4{font-size:15px;margin:0 0 8px}
.detail-cols ol{margin:0;padding-left:20px;font-size:15px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:15px;margin:12px 0 0}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;word-break:break-word}
.row-tools{white-space:nowrap;text-align:right;font-size:15px}
.row-tools .link-button+.link-button{margin-left:14px}
.ex-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 20px;white-space:nowrap}
.ex-actions form{margin:0}
.kp-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;max-width:760px}
.kp-form .field{margin-bottom:18px;max-width:none}
.field>.checkbox{display:grid;font-weight:400;font-size:17px;margin:0}
.kp-form .span2{grid-column:1/-1}

dialog{border:0;padding:0;width:min(560px,calc(100vw - 32px));border-top:6px solid var(--navy)}
dialog::backdrop{background:rgba(11,20,32,.55)}
dialog form{padding:26px 28px 28px}
dialog h2{margin:0 0 6px;font-size:22px}

.footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:14px}

@media (max-width:760px){
  .width{padding-left:16px;padding-right:16px}
  main{padding:24px 0 56px}
  h1{font-size:27px}
  h2{font-size:21px}
  .lede{font-size:17px}
  .masthead nav{display:none}
  .summary div,.figures div{grid-template-columns:1fr;gap:2px}
  .detail-cols,.kp-form{grid-template-columns:1fr}
  .hide-narrow{display:none}
  .tag{white-space:normal}
  th,td{padding-right:10px}
  .row-tools{white-space:normal;text-align:left;width:1%}
  .row-tools .link-button{display:block;margin:0 0 8px}
  .row-tools .link-button+.link-button{margin-left:0}
  .ex-actions{flex-direction:column;align-items:flex-start;gap:8px}
  .pos-head{flex-direction:column;gap:0}
  .pos-head .tag{margin:0 0 10px}
  tr.detail>td{padding:14px 12px 16px}
}
@media print{
  .masthead,.no-print,.button,.button-row,dialog,details:not([open]){display:none!important}
  main{padding:0}
  body{font-size:12pt}
  a{color:inherit;text-decoration:none}
}
</style>
