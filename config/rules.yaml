# Правила расчёта и сопоставления. Меняются без правки кода.
# Источник каждого правила указан в комментарии.

method:
  # Формула НМЦД: mean — среднее арифметическое (п. 3.21 Методических рекомендаций, приказ № 567);
  # median и min — для положений о закупке, где это предусмотрено.
  formula: mean
  min_suppliers: 3          # не менее трёх цен разных поставщиков (п. 3.19)
  cv_threshold: 0.33        # набор неоднороден при CV выше 33 % (п. 3.20.2)
  max_age_months: 36        # цены исполненных контрактов за последние три года (ч. 18 ст. 22 44-ФЗ)
  cpi_threshold_months: 6   # цены старше шести месяцев приводятся к текущему уровню (п. 3.14, 3.18)
  # stepwise — идентичные; если их меньше трёх, добавляются однородные (с пометкой).
  # strict — только идентичные.
  selection: stepwise

outliers:
  mad_min_n: 5              # с какого числа цен применяется модифицированный z-score
  mad_z: 3.5                # порог |M| (Iglewicz, Hoaglin)
  ratio_flag: 1.5           # флаг, если цена отличается от медианы больше чем в 1,5 раза
  ratio_exclude: 2.0        # исключение, если цена отличается от медианы больше чем в 2 раза
  ratio_any_n: true         # правило «больше чем в 2 раза» действует при любом числе цен, а не только при n < 5

matching:
  identical_delta: 0.20     # для «не менее/не более»: превышение до 20 % ещё идентично
  min_score: 0.35           # ниже этой релевантности предложение считается неподходящим

normalize:
  # фасовка по массе или объёму пересчитывается пропорционально, только если отличается от ТЗ не больше
  # чем во столько раз: цена реактива от фасовки нелинейна
  max_content_ratio: 2

card:
  # Разбор ТЗ без модели: существенными считаются характеристики, название которых начинается с этих слов.
  # Если в ТЗ названы товарный знак и модель, остальные характеристики считаются заданными моделью.
  essential_names: [вид, тип, формат, модель, марка, класс, технология, назначение, материал, состав,
                    плотность, масса листа, масса бумаги, область печати, рабочая область, объём, объем,
                    ёмкость, емкость, мощность, производительность, разрешение, диагональ, система экспрессии,
                    клеточная линия, штамм, действующее вещество, концентрация]
  max_essential: 4          # не больше стольких существенных характеристик на позицию
  descriptive_len: 80       # описание длиннее 80 знаков не делается существенным

vat:
  rate_2026: "0.22"         # НДС 22 % с 01.01.2026 (Федеральный закон от 28.11.2025 № 425-ФЗ)
  rate_before_2026: "0.20"

rounding: "0.01"
